[plugin]
name = "maibot_social_link_parser"
config_version = "0.3.4"
version = "0.3.4"
enabled = true
# Do not send to QQ/NapCat. Parsing and downloads still run for local validation.
dry_run = false

[parser]
# Add "bilibili" to enable B站 video and mini-program card parsing. Keep it disabled
# while a standalone Bilibili plugin is enabled, otherwise both plugins may reply.
enabled_platforms = ["douyin", "xhs", "xiaoheihe"]
block_ai_reply = true
download_mode = "confirm"
send_preview_image = true

[parser_advanced]
# When disabled, all fields in this group are ignored and built-in defaults are used.
enabled = false
# Access control. Denylist wins when it overlaps the allowlist.
group_whitelist = []
group_blacklist = []
user_whitelist = []
user_blacklist = []
private_whitelist = []
private_blacklist = []
# Extra regex merged with the default exact command “下载”.
# Leave empty to use the defaults only.
download_intent_regex = ""
debounce_seconds = 120
max_images = 9
max_text_chars = 700
send_images = true
send_video = true
use_forward_for_multi = true
gallery_delivery_mode = "default"
pending_download_ttl_seconds = 600
pending_download_selection = "latest"
# Users in these groups, or listed below, may reply to another user's bot overview
# and download its media. Leave both empty to require the original sender.
cross_sender_download_access_mode = "whitelist"
cross_sender_download_group_whitelist = []
cross_sender_download_user_whitelist = []
cross_sender_download_group_blacklist = []
cross_sender_download_user_blacklist = []
reaction_emoji_enabled = true
reaction_emoji_id = 76
source_max_size_mb = 80
source_max_minutes = 8

[network]
proxy = ""

[network_advanced]
# When disabled, all fields in this group are ignored and built-in defaults are used.
enabled = false
use_proxy_platforms = []
common_timeout = 30
download_timeout = 120
download_retry_times = 3

[cookies]
douyin = ""
xhs = ""
xiaoheihe = ""
bilibili = ""

[delivery]
# Default: route through MaiBot's active NapCat WebSocket gateway.
delivery_mode = "websocket"

[api]
# The fields below are used only when delivery_mode = "http".
host = "127.0.0.1"
port = 3000
token = ""
bot_uin = ""
